    <script>
        function calculateLocalTime() {
            // Pega o dia de hoje
            const now = new Date();
            
            // Define o horário para 12h (meio-dia) no Fuso de Brasília (UTC-3)
            // 12h BRT = 15h UTC
            const noonBRT = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 15, 0, 0));
            
            // Converte e formata automaticamente para o fuso horário da pessoa que abriu o site
            const timeString = noonBRT.toLocaleTimeString(navigator.language, { 
                hour: '2-digit', 
                minute: '2-digit'
            });
            
            // Insere o resultado no HTML
            document.getElementById('local-time').textContent = timeString;
        }

        calculateLocalTime();
    </script>
